[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fd-erp-ledger-mcp"
version = "0.1.0"
description = "ERP 账本内核 MCP：复式事件账 + 确认车道 + 只读对账滩头，行业无关、多租户、多币种、append-only 存证。"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "FindDataTechnology" }]
dependencies = [
    "fastmcp>=4.2.4,<5",
    "click",
    "uvicorn",
    "psycopg[binary,pool]>=3.1",
    # 运行指标（optimize-erp-solution 6.1）：/metrics 用 prometheus_client 暴露
    "prometheus_client>=0.20",
    # 门 K 词元轨的离线验签（change converge-line-identity-and-keys 8.5）：
    # `line-token-exchange` 发的是 ES256/RS256 的 JWT，pyjwt[crypto] 才有算法实现。
    # 与 fd-lex / fd-wire 同一条依赖，别在这里自造校验器。
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
fd-erp-ledger-mcp = "fd_erp_ledger_mcp.cli:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "no_db: 用例不依赖数据库（跳过 autouse 的 TRUNCATE 前置）",
]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fd_erp_ledger_mcp*"]

[tool.setuptools.package-data]
fd_erp_ledger_mcp = ["migrations/*.sql"]
