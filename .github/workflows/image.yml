# 共享实现见 FindDataTechnology/fd-ci（openspec: extract-shared-ci-workflow）。
# 本文件只声明「出什么镜像」，构建逻辑不在这里。
#
# 2026-11-21：本源仓此前没有出片 workflow，镜像一直靠通用池
# `testaction00x/build-pool` 出（池已全部删除）。仓已公开，标准 runner
# 免费无限，从此本源仓自己出片 —— 与 fd-info / fd-shared 同形态。
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-erp-ledger-mcp
      namespace: finddata-business
      # 构建后、推 tag 前让镜像真启动一次。此前这里为空 ⇒ 「构建 success」只等于
      # docker build 过了；2026-11-26 实测镜像能构建、却因迁移没跑而在 fd-prod
      # CrashLoop 33 小时（`ErpError: 数据库 schema 版本落后于代码要求`）。
      # fd-ci 把这段当 shell 跑，$IMG 是刚构建的本地镜像；内容真相在 scripts/ci-smoke.sh。
      # 用 `bash <路径>` 一行转过去，避免两处维护同一段脚本。
      smoke_script: bash scripts/ci-smoke.sh
